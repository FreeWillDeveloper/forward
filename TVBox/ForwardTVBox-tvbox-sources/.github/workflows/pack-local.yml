name: 云端自动打包本地包

on:
  schedule:
    # 每天北京时间 17:10 运行（UTC 09:10）：本地 16:00 直播测速已 push，源也已更新
    - cron: '10 9 * * *'
  workflow_dispatch:  # 支持手动触发（GitHub Actions 页 → Run workflow）

concurrency:
  group: tvbox-pack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行云端打包
        id: run_pack
        run: python pack.py

      - name: 检查是否有变化
        id: check_changes
        run: |
          git add -A
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 提交打包结果
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "📦 云端自动打包最新本地包 - $(date +'%Y-%m-%d %H:%M')"
          git push
