name: 🤖 Build FongMi APK (type= mod) v10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tvbox-sources (self)
        uses: actions/checkout@v4

      - name: Checkout FongMi/TV (branch fongmi)
        uses: actions/checkout@v4
        with:
          repository: FongMi/TV
          ref: fongmi
          path: fongmi

      - name: Apply mod — type= + 共存改名(疯影视)
        run: |
          # 1) CMS分类参数 t= → type=（9源分类复活）
          sed -i 's/params.put("t", tid);/params.put("type", tid);/' fongmi/app/src/main/java/com/fongmi/android/tv/api/SiteApi.java
          grep -n 'params.put("type", tid)' fongmi/app/src/main/java/com/fongmi/android/tv/api/SiteApi.java
          # 2) applicationId 加后缀 → 与原版共存安装
          sed -i 's/applicationId "com.fongmi.android.tv"/applicationId "com.fongmi.android.tv.feng"/' fongmi/app/build.gradle
          grep -n 'applicationId' fongmi/app/build.gradle
          # 3) 改名 疯影视
          sed -i 's|<string name="app_name">TV</string>|<string name="app_name">疯影视</string>|' fongmi/app/src/main/res/values/strings.xml
          sed -i 's|<string name="app_name">影视</string>|<string name="app_name">疯影视</string>|' fongmi/app/src/main/res/values-zh-rCN/strings.xml
          grep -rn 'app_name' fongmi/app/src/main/res/values/strings.xml fongmi/app/src/main/res/values-zh-rCN/strings.xml
          # 4) versionName → 5.6.1-feng（源码最新5.6.0，对齐Release线+标识魔改）
          sed -i 's/versionName "5.6.0"/versionName "5.6.1-feng"/' fongmi/app/build.gradle
          grep -n 'versionName' fongmi/app/build.gradle
          # 5) R8 keep 规则：保 ReorderingBufferQueue（lib-container），防止混淆误删导致 NoClassDefFoundError
          echo '-keep class androidx.media3.container.ReorderingBufferQueue { *; }' >> fongmi/app/proguard-rules-media.pro
          tail -3 fongmi/app/proguard-rules-media.pro

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (chaquopy)
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.10'

      - name: Install Android SDK 37 + NDK 27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" "ndk;27.2.12479018" >/dev/null 2>&1 || true
          echo "sdks ready"

      - name: Checkout FongMi/media (media3 mod)
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: release-1.11.0-fongmi
          path: media

      - name: Build FFmpeg native libs (decoder-ffmpeg 依赖)
        run: |
          # 浅克隆 FongMi/FFmpeg 源码
          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git "$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg"
          ls "$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/configure" >/dev/null && echo "ffmpeg source OK"
          # 探测可用的 NDK（runner 自带或 sdkmanager 装的）
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "no ndk dir"
          NDK_PATH="$(ls -d "$ANDROID_HOME/ndk/"*/ 2>/dev/null | head -1 | sed 's|/\$||')"
          if [ -z "$NDK_PATH" ] || [ ! -f "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" ]; then
            echo "standard NDK not found, searching..."
            find "$ANDROID_HOME/ndk" -name 'aarch64-linux-android21-clang' 2>/dev/null | head -3
            NDK_D="$(find "$ANDROID_HOME/ndk" -type d -name prebuilt 2>/dev/null | head -1)"
            NDK_PATH="$(dirname "$(dirname "$(dirname "$NDK_D")")")"
          fi
          echo "using NDK: $NDK_PATH"
          cd "$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main"
          chmod +x jni/build_ffmpeg.sh
          jni/build_ffmpeg.sh "$(pwd)" "$NDK_PATH" linux-x86_64 21 aac mp3 opus vorbis flac ac3 eac3 dts h264 hevc mpeg4 vp8 vp9 mjpeg > "$GITHUB_WORKSPACE/ffmpeg-build.log" 2>&1
          echo "FFMPEG_BUILD_EXIT=$?"
          ls "$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs/arm64-v8a/" || echo "no arm64 libs"
          tail -15 "$GITHUB_WORKSPACE/ffmpeg-build.log"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fongmi/gradle/libs.versions.toml', 'fongmi/**/build.gradle', 'media/settings.gradle.kts') }}

      - name: Build media3 modules (aar)
        working-directory: media
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :lib-common:assembleRelease :lib-database:assembleRelease :lib-datasource:assembleRelease :lib-datasource-okhttp:assembleRelease :lib-datasource-rtmp:assembleRelease :lib-effect:assembleRelease :lib-exoplayer:assembleRelease :lib-exoplayer-hls:assembleRelease :lib-exoplayer-dash:assembleRelease :lib-exoplayer-rtsp:assembleRelease :lib-extractor:assembleRelease :lib-mpvplayer:assembleRelease :lib-decoder:assembleRelease :lib-decoder-ffmpeg:assembleRelease :lib-decoder-mpegh:assembleRelease :lib-session:assembleRelease :lib-ui:assembleRelease :lib-ui-danmaku:assembleRelease :lib-container:assembleRelease --no-daemon --stacktrace > "$GITHUB_WORKSPACE/media-gradle.log" 2>&1
          ec=$?
          set -e
          echo "MEDIA_GRADLE_EXIT=$ec" >> "$GITHUB_WORKSPACE/media-gradle.log"
          echo "===== media gradle log tail ====="
          tail -100 "$GITHUB_WORKSPACE/media-gradle.log"
          if [ "$ec" != "0" ]; then exit $ec; fi
          echo "=== aars ==="
          find . -path "*/build*/outputs/aar/*.aar" -type f

      - name: Copy aars to TV app/libs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fongmi/app/libs"
          find "$GITHUB_WORKSPACE/media" -path "*/build*/outputs/aar/*.aar" -type f -exec cp {} "$GITHUB_WORKSPACE/fongmi/app/libs/" \;
          echo "=== copied aars ==="
          ls -la "$GITHUB_WORKSPACE/fongmi/app/libs/"
          ls -la "$GITHUB_WORKSPACE/fongmi/app/libs/"

      - name: Generate keystore & local.properties
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/fongmi/app/release.keystore" -alias fongmi -keyalg RSA -keysize 2048 -validity 10000 -storepass fongmi123 -keypass fongmi123 -dname "CN=FongMi Mod, OU=TV, O=jifeng250, L=CN, ST=CN, C=CN" >/dev/null 2>&1
          printf 'storeFile=release.keystore\nkeyAlias=fongmi\nstorePassword=fongmi123\n' > "$GITHUB_WORKSPACE/fongmi/local.properties"
          echo "keystore done"

      - name: Build TV APK (assembleRelease)
        working-directory: fongmi
        run: |
          chmod +x gradlew
          set +e
          # release构建（含R8混淆，ReorderingBufferQueue已加keep规则防误删）
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > "$GITHUB_WORKSPACE/gradle.log" 2>&1
          ec=$?
          set -e
          echo "GRADLE_EXIT=$ec" >> "$GITHUB_WORKSPACE/gradle.log"
          echo "===== gradle log tail ====="
          tail -80 "$GITHUB_WORKSPACE/gradle.log"
          echo "===== APK files ====="
          find . -name "*.apk" -type f || true
          if [ "$ec" != "0" ]; then exit $ec; fi

      - name: Commit build log (always)
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          cp "$GITHUB_WORKSPACE/gradle.log" "$GITHUB_WORKSPACE/build-logs/gradle.log" 2>/dev/null || echo "no gradle.log" > "$GITHUB_WORKSPACE/build-logs/gradle.log"
          cp "$GITHUB_WORKSPACE/media-gradle.log" "$GITHUB_WORKSPACE/build-logs/media-gradle.log" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/ffmpeg-build.log" "$GITHUB_WORKSPACE/build-logs/ffmpeg-build.log" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/fongmi" -name "*.apk" -type f > "$GITHUB_WORKSPACE/build-logs/apk-files.txt" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/jifeng250/tvbox-sources.git"
          git config user.name "jifeng250 bot"
          git config user.email "bot@users.noreply.github.com"
          git add build-logs/ gradle.log media-gradle.log
          git commit -m "📋 build log run ${{ github.run_number }} [skip ci]" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase origin main >/dev/null 2>&1 || true
            git push origin main && break
            sleep 3
          done

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: fongmi/**/*.apk
          tag_name: fongmi-mod-${{ github.run_number }}
          name: FongMi 5.6.1 mod（type=分类参数支持）
          body: |
            - 魔改: SiteApi.java 分类请求参数 t= → type=
            - 效果: 9源分类浏览全部可用
            - 构建: release版（含R8混淆，ReorderingBufferQueue已加keep规则）
            - 自动构建: GitHub Actions
          make_latest: true
          overwrite: true