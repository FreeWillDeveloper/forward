<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="ar-sa">
<title id="title">من أول لعبة إلى مشاريع معقدة</title><desc id="desc">أثبت تقدمك بنتيجة عملية في كل خطوة، وتابع عندما يتطلب هدفك ذلك. التجربة الأولى / أنشئ برنامجًا بالحوار / لعبة تعمل; المرحلة 1 · النموذج الأولي / اختبر فكرتك / نموذج يمكن عرضه; المرحلة 2 · التطوير المتكامل / انشر التطبيق بنفسك / تطبيق عبر الإنترنت; المرحلة 3 · التطوير المتقدم / أدر مشاريع أكبر / مشروع يتطور باستمرار</desc>
