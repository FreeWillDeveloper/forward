<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="es-es">
<title id="title">Del primer juego a proyectos complejos</title><desc id="desc">Demuestra cada avance con un resultado funcional y continúa cuando tu objetivo lo requiera. PRIMER CONTACTO / Crear conversando / Un juego funcional; ETAPA 1 · PROTOTIPOS / Validar una idea / Un prototipo demostrable; ETAPA 2 · FULL STACK / Publicar por tu cuenta / Una aplicación en línea; ETAPA 3 · AVANZADO / Llevar proyectos mayores / Un proyecto que evoluciona</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="1198" height="948" rx="22" fill="#FFFFFF" stroke="#DCE8F6"/>
<text x="40" y="43" font-size="22" fill="#0982E6" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">easy-vibe</text>
<text x="1160" y="43" font-size="15" fill="#6985A6" font-weight="600" text-anchor="end" data-fit-width="600" data-fit-base-size="15">02 / OBSERVA TU PROGRESO</text>
<text x="40" y="102" font-size="38" fill="#132B49" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="38">Del primer juego a proyectos complejos</text>
<text x="40" y="143" font-size="21" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="21">Demuestra cada avance con un resultado funcional y continúa cuando tu objetivo lo requiera.</text>
<path d="M40 778H315V718H605V658H895V598H1160" stroke="#B8CEE9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="365" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="40" y="365" width="250" height="7" rx="3" fill="#1674DB"/>
<rect x="58" y="387" width="42" height="37" rx="9" fill="#EDF5FF"/>
<text x="79" y="413" font-size="23" fill="#1674DB" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">00</text>
<text x="58" y="453" font-size="13" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">PRIMER CONTACTO</text>
<text x="58" y="493" font-size="21" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Crear conversando</text>
<text x="58" y="529" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Describir → ejecutar → ver → ajustar</text>
<text x="58" y="559" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Hazlo funcionar y cambia una función.</text>
<path d="M58 581h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="58" y="609" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">META DE LA ETAPA</text>
<text x="58" y="643" font-size="18" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Un juego funcional</text>
<path d="M60 675l4 4 7-9" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="79" y="680" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Explica las entradas y salidas.</text>
<path d="M60 703l4 4 7-9" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="79" y="708" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Comprueba que sigue funcionando.</text>
<path d="M301 462l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="330" y="305" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="330" y="305" width="250" height="7" rx="3" fill="#6755C9"/>
<rect x="348" y="327" width="42" height="37" rx="9" fill="#F1EEFF"/>
<text x="369" y="353" font-size="23" fill="#6755C9" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">01</text>
<text x="348" y="393" font-size="13" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">ETAPA 1 · PROTOTIPOS</text>
<text x="348" y="433" font-size="21" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Validar una idea</text>
<text x="348" y="469" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Necesidad → prototipo → IA</text>
<text x="348" y="499" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Recoge opiniones de usuarios reales.</text>
<path d="M348 521h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="348" y="549" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">META DE LA ETAPA</text>
<text x="348" y="583" font-size="17.2" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Un prototipo demostrable</text>
<path d="M350 615l4 4 7-9" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="369" y="620" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Explica para quién y para qué.</text>
<path d="M350 643l4 4 7-9" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="369" y="648" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Mejora algo a partir de opiniones.</text>
<path d="M591 402l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="620" y="245" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="620" y="245" width="250" height="7" rx="3" fill="#088878"/>
<rect x="638" y="267" width="42" height="37" rx="9" fill="#EAF8F4"/>
<text x="659" y="293" font-size="23" fill="#088878" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">02</text>
<text x="638" y="333" font-size="13" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">ETAPA 2 · FULL STACK</text>
<text x="638" y="373" font-size="19.9" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Publicar por tu cuenta</text>
<text x="638" y="409" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Interfaz → API → datos → despliegue</text>
<text x="638" y="439" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Conecta las piezas de un proyecto.</text>
<path d="M638 461h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="638" y="489" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">META DE LA ETAPA</text>
<text x="638" y="523" font-size="18" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Una aplicación en línea</text>
<path d="M640 555l4 4 7-9" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="659" y="560" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Guarda datos y prueba el flujo.</text>
<path d="M640 583l4 4 7-9" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="659" y="588" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Otra persona puede usarla.</text>
<path d="M881 342l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="910" y="185" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="910" y="185" width="250" height="7" rx="3" fill="#B66B1B"/>
<rect x="928" y="207" width="42" height="37" rx="9" fill="#FFF4E6"/>
<text x="949" y="233" font-size="23" fill="#B66B1B" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">03</text>
<text x="928" y="273" font-size="13" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">ETAPA 3 · AVANZADO</text>
<text x="928" y="313" font-size="17" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Llevar proyectos mayores</text>
<text x="928" y="349" font-size="11" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="11">Tareas → herramientas → plataforma</text>
<text x="928" y="379" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Elige herramientas según el proyecto.</text>
<path d="M928 401h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="928" y="429" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">META DE LA ETAPA</text>
<text x="928" y="463" font-size="15.7" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Un proyecto que evoluciona</text>
<path d="M930 495l4 4 7-9" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="949" y="500" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Define el alcance y los criterios.</text>
<path d="M930 523l4 4 7-9" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="949" y="528" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Verifica los flujos tras cada cambio.</text>
<rect x="355" y="725" width="805" height="85" rx="12" fill="#F2F7FD"/>
<text x="378" y="759" font-size="22" fill="#24486D" font-weight="600" text-anchor="start" data-fit-width="760" data-fit-base-size="22">Conserva tu trabajo y un registro de mejoras</text>
<text x="378" y="792" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="760" data-fit-base-size="16">Reutiliza tu proyecto: detecta un problema, investiga, modifica y verifica.</text>
<rect x="40" y="848" width="1120" height="62" rx="12" fill="#F6F9FD"/>
<text x="62" y="887" font-size="17" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="17">No hace falta leerlo todo primero</text>
<text x="428" y="887" font-size="17" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="17">Consulta el apéndice cuando lo necesites</text>
<text x="794" y="887" font-size="17" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="17">Elige una ruta avanzada según tu proyecto</text>
