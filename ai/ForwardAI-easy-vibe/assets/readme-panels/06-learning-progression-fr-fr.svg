<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="fr-fr">
<title id="title">Du premier jeu aux projets complexes</title><desc id="desc">À chaque étape, vérifiez vos progrès avec un résultat concret. Continuez selon vos objectifs. PREMIER ESSAI / Créer par le dialogue / Un jeu qui fonctionne; ÉTAPE 1 · PROTOTYPE / Valider une idée / Un prototype à montrer; ÉTAPE 2 · FULL STACK / Publier en autonomie / Une application en ligne; ÉTAPE 3 · AVANCÉ / Gérer plus de complexité / Un projet qui évolue</desc>
