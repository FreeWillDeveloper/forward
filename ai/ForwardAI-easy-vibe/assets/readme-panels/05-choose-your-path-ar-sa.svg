<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc" lang="ar-sa">
<title id="title">من أين نبدأ؟</title><desc id="desc">اختر المسار حسب مهاراتك الحالية وما تريد بناءه. مبتدئ في البرمجة / التجربة الأولى ← المرحلة 1 / لعبة صغيرة تعمل; لديك فكرة تريد اختبارها / المرحلة 1 · النموذج الأولي / نموذج منتج قابل للتجربة; تكتب الشيفرة وتريد النشر / المرحلة 2 · التطوير المتكامل / تطبيق متاح عبر الإنترنت; أنجزت مشاريع وتريد التقدم / المرحلة 3 · التطوير المتقدم / مشروع قابل للتحسين المستمر</desc>
