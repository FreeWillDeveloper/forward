<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="de-de">
<title id="title">Vom ersten Spiel zu komplexen Projekten</title><desc id="desc">Zeige jeden Fortschritt an einem funktionierenden Ergebnis. Gehe nach Bedarf weiter. ERSTE SCHRITTE / Im Dialog entwickeln / Ein lauffähiges Spiel; STUFE 1 · PROTOTYPEN / Eine Idee validieren / Ein vorführbarer Prototyp; STUFE 2 · FULL STACK / Selbstständig ausliefern / Eine online nutzbare App; STUFE 3 · VERTIEFUNG / Größere Projekte steuern / Ein erweiterbares Projekt</desc>
