<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc" lang="vi-vn">
<title id="title">Chúng ta nên bắt đầu từ đâu?</title><desc id="desc">Chọn theo kỹ năng hiện tại và sản phẩm bạn muốn tạo ra. Chưa biết lập trình / TRẢI NGHIỆM ĐẦU → GIAI ĐOẠN 1 / Một trò chơi chạy được; Có ý tưởng cần kiểm chứng / GIAI ĐOẠN 1 · NGUYÊN MẪU / Nguyên mẫu có thể dùng thử; Biết viết mã, muốn ra mắt / GIAI ĐOẠN 2 · FULL STACK / Ứng dụng dùng trực tuyến; Đã ra mắt, muốn tiến xa hơn / GIAI ĐOẠN 3 · NÂNG CAO / Dự án có thể cải tiến lâu dài</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="1198" height="888" rx="22" fill="#FFFFFF" stroke="#DCE8F6"/>
<text x="40" y="43" font-size="22" fill="#0982E6" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">easy-vibe</text>
<text x="1160" y="43" font-size="15" fill="#6985A6" font-weight="600" text-anchor="end" data-fit-width="600" data-fit-base-size="15">01 / CHỌN ĐIỂM BẮT ĐẦU</text>
<text x="40" y="103" font-size="38" fill="#132B49" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="38">Chúng ta nên bắt đầu từ đâu?</text>
<text x="40" y="144" font-size="22" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">Chọn theo kỹ năng hiện tại và sản phẩm bạn muốn tạo ra.</text>
<rect x="40" y="176" width="1120" height="46" rx="10" fill="#F2F7FD"/>
<text x="62" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="288" data-fit-base-size="20">Điểm xuất phát</text>
<text x="370" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="20">Học gì và học thế nào</text>
<text x="905" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Kết quả đầu tiên</text>
<rect x="40" y="238" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="238" width="6" height="126" rx="3" fill="#1674DB"/>
<text x="64" y="278" font-size="22" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Chưa biết lập trình</text>
<text x="64" y="311" font-size="14.7" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Học sinh, sinh viên, giáo viên, người đi làm</text>
<text x="370" y="265" font-size="12" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">TRẢI NGHIỆM ĐẦU → GIAI ĐOẠN 1</text>
<rect x="370" y="278" width="148" height="32" rx="7" fill="#EDF5FF"/>
<text x="444" y="300" font-size="16" fill="#1674DB" font-weight="550" text-anchor="middle" data-fit-width="132" data-fit-base-size="16">Thử lập trình AI</text>
<path d="M524 294h13m-4-4 4 4-4 4" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="548" y="278" width="148" height="32" rx="7" fill="#EDF5FF"/>
<text x="622" y="300" font-size="16" fill="#1674DB" font-weight="550" text-anchor="middle" data-fit-width="132" data-fit-base-size="16">Dùng IDE AI</text>
<text x="370" y="341" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Chạy ví dụ, rồi tự sửa một tính năng.</text>
<path d="M875 263v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="288" font-size="20" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Một trò chơi chạy được</text>
<text x="905" y="322" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Từ ý tưởng đến sản phẩm thực tế.</text>
<rect x="40" y="380" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="380" width="6" height="126" rx="3" fill="#6755C9"/>
<text x="64" y="420" font-size="21" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Có ý tưởng cần kiểm chứng</text>
<text x="64" y="453" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Sản phẩm, thiết kế, khởi nghiệp</text>
<text x="370" y="407" font-size="12" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">GIAI ĐOẠN 1 · NGUYÊN MẪU</text>
<rect x="370" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="439" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Tìm nhu cầu</text>
<path d="M514 436h13m-4-4 4 4-4 4" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="607" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Tạo mẫu</text>
<path d="M682 436h13m-4-4 4 4-4 4" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="775" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Tích hợp AI</text>
<text x="370" y="483" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Mời người dùng mục tiêu thử và góp ý.</text>
<path d="M875 405v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="430" font-size="16.6" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Nguyên mẫu có thể dùng thử</text>
<text x="905" y="464" font-size="14.1" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Xác nhận nhu cầu trước khi làm tiếp.</text>
<rect x="40" y="522" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="522" width="6" height="126" rx="3" fill="#088878"/>
<text x="64" y="562" font-size="22" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Biết viết mã, muốn ra mắt</text>
<text x="64" y="595" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Lập trình frontend và backend</text>
<text x="370" y="549" font-size="12" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">GIAI ĐOẠN 2 · FULL STACK</text>
<rect x="370" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="439" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Giao diện &amp; API</text>
<path d="M514 578h13m-4-4 4 4-4 4" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="607" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Cơ sở dữ liệu</text>
<path d="M682 578h13m-4-4 4 4-4 4" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="775" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Triển khai</text>
<text x="370" y="625" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Chọn một dự án và kết nối các phần.</text>
<path d="M875 547v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="572" font-size="18.1" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Ứng dụng dùng trực tuyến</text>
<text x="905" y="606" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Đi từ phát triển đến ra mắt.</text>
<rect x="40" y="664" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="664" width="6" height="126" rx="3" fill="#B66B1B"/>
<text x="64" y="704" font-size="20.8" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Đã ra mắt, muốn tiến xa hơn</text>
<text x="64" y="737" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Lập trình viên, trưởng nhóm kỹ thuật</text>
<text x="370" y="691" font-size="12" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">GIAI ĐOẠN 3 · NÂNG CAO</text>
<rect x="370" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="439" y="726" font-size="16" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Quy trình AI</text>
<path d="M514 720h13m-4-4 4 4-4 4" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="607" y="726" font-size="14.7" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Mở rộng công cụ</text>
<path d="M682 720h13m-4-4 4 4-4 4" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="775" y="726" font-size="16" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Đa nền tảng</text>
<text x="370" y="767" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Chọn một hướng; chia việc và kiểm tra.</text>
<path d="M875 689v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="714" font-size="17.4" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Dự án có thể cải tiến lâu dài</text>
<text x="905" y="748" font-size="13.5" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Cộng tác với AI theo quy trình ổn định.</text>
<text x="40" y="854" font-size="17" fill="#607B99" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="17">Xem hướng dẫn học trước. Có thể bỏ qua phần đã biết; chọn theo năng lực và mục tiêu, không chỉ theo nghề nghiệp.</text>
</g></svg>
