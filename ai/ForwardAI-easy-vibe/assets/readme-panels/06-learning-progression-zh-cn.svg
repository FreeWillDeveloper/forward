<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="zh-cn">
<title id="title">从第一个小游戏，到能交付复杂项目</title><desc id="desc">每走一步，都用一个实际作品确认进步；能完成当前目标，再按需要继续。 新手体验 / 会用对话做程序 / 能运行的小游戏; 阶段 1 · 产品原型 / 会验证一个想法 / 可演示的产品原型; 阶段 2 · 全栈开发 / 能独立部署上线 / 可在线使用的应用; 阶段 3 · 进阶开发 / 能推进复杂项目 / 可持续迭代的项目</desc>
<g font-family="Hiragino Sans GB, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="1" y="1" width="1198" height="948" rx="22" fill="#FFFFFF" stroke="#DCE8F6"/>
<text x="40" y="43" font-size="22" fill="#0982E6" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">easy-vibe</text>
<text x="1160" y="43" font-size="15" fill="#6985A6" font-weight="600" text-anchor="end" data-fit-width="600" data-fit-base-size="15">02 / 看成长路线</text>
<text x="40" y="102" font-size="36" fill="#132B49" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="36">从第一个小游戏，到能交付复杂项目</text>
<text x="40" y="143" font-size="21" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="21">每走一步，都用一个实际作品确认进步；能完成当前目标，再按需要继续。</text>
<path d="M40 778H315V718H605V658H895V598H1160" stroke="#B8CEE9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="365" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="40" y="365" width="250" height="7" rx="3" fill="#1674DB"/>
<rect x="58" y="387" width="42" height="37" rx="9" fill="#EDF5FF"/>
<text x="79" y="413" font-size="23" fill="#1674DB" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">00</text>
<text x="58" y="453" font-size="17" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="17">新手体验</text>
<text x="58" y="493" font-size="25" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="25">会用对话做程序</text>
<text x="58" y="529" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">描述 → 运行 → 观察 → 修改</text>
<text x="58" y="559" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">先跑通，再改一个小功能</text>
<path d="M58 581h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="58" y="609" font-size="16" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="16">完成标志</text>
<text x="58" y="643" font-size="21" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="21">能运行的小游戏</text>
<path d="M60 675l4 4 7-9" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="79" y="680" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">说清输入和输出</text>
<path d="M60 703l4 4 7-9" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="79" y="708" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">改完还能正常运行</text>
<path d="M301 462l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="330" y="305" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="330" y="305" width="250" height="7" rx="3" fill="#6755C9"/>
<rect x="348" y="327" width="42" height="37" rx="9" fill="#F1EEFF"/>
<text x="369" y="353" font-size="23" fill="#6755C9" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">01</text>
<text x="348" y="393" font-size="17" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="17">阶段 1 · 产品原型</text>
<text x="348" y="433" font-size="25" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="25">会验证一个想法</text>
<text x="348" y="469" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">找需求 → 做原型 → 接 AI</text>
<text x="348" y="499" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">让真实用户试用并收集反馈</text>
<path d="M348 521h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="348" y="549" font-size="16" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="16">完成标志</text>
<text x="348" y="583" font-size="21" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="21">可演示的产品原型</text>
<path d="M350 615l4 4 7-9" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="369" y="620" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">说清为谁解决什么问题</text>
<path d="M350 643l4 4 7-9" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="369" y="648" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">根据反馈完成一次修改</text>
<path d="M591 402l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="620" y="245" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="620" y="245" width="250" height="7" rx="3" fill="#088878"/>
<rect x="638" y="267" width="42" height="37" rx="9" fill="#EAF8F4"/>
<text x="659" y="293" font-size="23" fill="#088878" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">02</text>
<text x="638" y="333" font-size="17" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="17">阶段 2 · 全栈开发</text>
<text x="638" y="373" font-size="25" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="25">能独立部署上线</text>
<text x="638" y="409" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">界面 → 接口 → 数据 → 部署</text>
<text x="638" y="439" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">在综合项目里把前后端接起来</text>
<path d="M638 461h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="638" y="489" font-size="16" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="16">完成标志</text>
<text x="638" y="523" font-size="21" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="21">可在线使用的应用</text>
<path d="M640 555l4 4 7-9" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="659" y="560" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">数据能保存、流程能跑通</text>
<path d="M640 583l4 4 7-9" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="659" y="588" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">其他人能打开并使用</text>
<path d="M881 342l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="910" y="185" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="910" y="185" width="250" height="7" rx="3" fill="#B66B1B"/>
<rect x="928" y="207" width="42" height="37" rx="9" fill="#FFF4E6"/>
<text x="949" y="233" font-size="23" fill="#B66B1B" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">03</text>
<text x="928" y="273" font-size="17" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="17">阶段 3 · 进阶开发</text>
<text x="928" y="313" font-size="25" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="25">能推进复杂项目</text>
<text x="928" y="349" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">拆任务 → 扩工具 → 选平台</text>
<text x="928" y="379" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="15">按需选择工作流、工具和平台</text>
<path d="M928 401h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="928" y="429" font-size="16" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="16">完成标志</text>
<text x="928" y="463" font-size="21" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="21">可持续迭代的项目</text>
<path d="M930 495l4 4 7-9" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="949" y="500" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">任务有边界、结果能验收</text>
<path d="M930 523l4 4 7-9" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="949" y="528" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="16">修改后检查关键流程</text>
<rect x="355" y="725" width="805" height="85" rx="12" fill="#F2F7FD"/>
<text x="378" y="759" font-size="24" fill="#24486D" font-weight="600" text-anchor="start" data-fit-width="760" data-fit-base-size="24">每一步，都留下作品和改进记录</text>
<text x="378" y="792" font-size="18" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="760" data-fit-base-size="18">遇到问题 → 找原因 → 修改 → 验证，把改进带进下一个版本。</text>
<rect x="40" y="848" width="1120" height="62" rx="12" fill="#F6F9FD"/>
<text x="62" y="887" font-size="20" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="20">不必一次学完整个仓库</text>
<text x="428" y="887" font-size="20" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="20">缺基础时，再查附录</text>
<text x="794" y="887" font-size="20" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="20">进阶按项目需要选一条路线</text>
</g></svg>
