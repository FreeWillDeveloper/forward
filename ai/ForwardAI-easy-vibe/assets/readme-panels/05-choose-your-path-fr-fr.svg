<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc" lang="fr-fr">
<title id="title">Par où commencer ?</title><desc id="desc">Choisissez selon vos compétences actuelles et ce que vous voulez créer. Je débute en programmation / PREMIER ESSAI → ÉTAPE 1 / Un petit jeu qui fonctionne; J’ai une idée à valider / ÉTAPE 1 · PROTOTYPE / Un prototype à tester; Je sais coder, je veux publier / ÉTAPE 2 · DÉVELOPPEMENT FULL STACK / Une application en ligne; J’ai déjà livré des projets / ÉTAPE 3 · DÉVELOPPEMENT AVANCÉ / Un projet qui évolue</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="1198" height="888" rx="22" fill="#FFFFFF" stroke="#DCE8F6"/>
<text x="40" y="43" font-size="22" fill="#0982E6" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">easy-vibe</text>
<text x="1160" y="43" font-size="15" fill="#6985A6" font-weight="600" text-anchor="end" data-fit-width="600" data-fit-base-size="15">01 / CHOISIR SON DÉPART</text>
<text x="40" y="103" font-size="38" fill="#132B49" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="38">Par où commencer ?</text>
<text x="40" y="144" font-size="22" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">Choisissez selon vos compétences actuelles et ce que vous voulez créer.</text>
<rect x="40" y="176" width="1120" height="46" rx="10" fill="#F2F7FD"/>
<text x="62" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="288" data-fit-base-size="20">Votre point de départ</text>
<text x="370" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="20">Quoi apprendre, et comment</text>
<text x="905" y="206" font-size="17.7" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un premier résultat concret</text>
<rect x="40" y="238" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="238" width="6" height="126" rx="3" fill="#1674DB"/>
<text x="64" y="278" font-size="20.5" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Je débute en programmation</text>
<text x="64" y="311" font-size="16.4" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Étudiants, enseignants, professionnels</text>
<text x="370" y="265" font-size="12" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">PREMIER ESSAI → ÉTAPE 1</text>
<rect x="370" y="278" width="148" height="32" rx="7" fill="#EDF5FF"/>
<text x="444" y="300" font-size="16" fill="#1674DB" font-weight="550" text-anchor="middle" data-fit-width="132" data-fit-base-size="16">Coder avec l’IA</text>
<path d="M524 294h13m-4-4 4 4-4 4" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="548" y="278" width="148" height="32" rx="7" fill="#EDF5FF"/>
<text x="622" y="300" font-size="16" fill="#1674DB" font-weight="550" text-anchor="middle" data-fit-width="132" data-fit-base-size="16">Utiliser un IDE IA</text>
<text x="370" y="341" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Lancez un exemple, puis changez une fonction.</text>
<path d="M875 263v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="288" font-size="18.3" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un petit jeu qui fonctionne</text>
<text x="905" y="322" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Passer de l’idée à un résultat réel.</text>
<rect x="40" y="380" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="380" width="6" height="126" rx="3" fill="#6755C9"/>
<text x="64" y="420" font-size="22" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">J’ai une idée à valider</text>
<text x="64" y="453" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Produit, design, entrepreneuriat</text>
<text x="370" y="407" font-size="12" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">ÉTAPE 1 · PROTOTYPE</text>
<rect x="370" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="439" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Besoin réel</text>
<path d="M514 436h13m-4-4 4 4-4 4" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="607" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Prototyper</text>
<path d="M682 436h13m-4-4 4 4-4 4" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="775" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Ajouter l’IA</text>
<text x="370" y="483" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Faites essayer le prototype, puis améliorez-le.</text>
<path d="M875 405v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="430" font-size="20" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un prototype à tester</text>
<text x="905" y="464" font-size="13.4" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Valider le besoin avant d’aller plus loin.</text>
<rect x="40" y="522" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="522" width="6" height="126" rx="3" fill="#088878"/>
<text x="64" y="562" font-size="20.3" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Je sais coder, je veux publier</text>
<text x="64" y="595" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Développement frontend et backend</text>
<text x="370" y="549" font-size="12" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">ÉTAPE 2 · DÉVELOPPEMENT FULL STACK</text>
<rect x="370" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="439" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Interface et API</text>
<path d="M514 578h13m-4-4 4 4-4 4" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="607" y="584" font-size="14.6" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Base de données</text>
<path d="M682 578h13m-4-4 4 4-4 4" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="775" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Déployer</text>
<text x="370" y="625" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Choisissez un projet et reliez les éléments.</text>
<path d="M875 547v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="572" font-size="20" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Une application en ligne</text>
<text x="905" y="606" font-size="13.8" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Du développement à la mise en ligne.</text>
<rect x="40" y="664" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="664" width="6" height="126" rx="3" fill="#B66B1B"/>
<text x="64" y="704" font-size="22" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">J’ai déjà livré des projets</text>
<text x="64" y="737" font-size="15.1" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Développeurs et responsables techniques</text>
<text x="370" y="691" font-size="12" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">ÉTAPE 3 · DÉVELOPPEMENT AVANCÉ</text>
<rect x="370" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="439" y="726" font-size="16" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Flux avec l’IA</text>
<path d="M514 720h13m-4-4 4 4-4 4" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="607" y="726" font-size="14.4" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Étendre les outils</text>
<path d="M682 720h13m-4-4 4 4-4 4" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="775" y="726" font-size="16" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Plateformes</text>
<text x="370" y="767" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Choisissez un parcours, découpez et vérifiez.</text>
<path d="M875 689v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="714" font-size="20" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un projet qui évolue</text>
<text x="905" y="748" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Fiabiliser la collaboration avec l’IA.</text>
<text x="40" y="854" font-size="17" fill="#607B99" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="17">Commencez par le guide. Passez ce que vous maîtrisez : choisissez selon vos capacités et votre objectif, pas seulement votre métier.</text>
</g></svg>
