<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc" lang="es-es">
<title id="title">¿Por dónde empezamos?</title><desc id="desc">Elige según lo que ya sabes y lo que quieres construir. Sin experiencia en código / PRIMER CONTACTO → ETAPA 1 / Un pequeño juego funcional; Una idea por validar / ETAPA 1 · PROTOTIPOS / Un prototipo de producto; Sé programar, quiero publicar / ETAPA 2 · DESARROLLO FULL STACK / Una aplicación en línea; Ya he publicado proyectos / ETAPA 3 · DESARROLLO AVANZADO / Un proyecto que evoluciona</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="1198" height="888" rx="22" fill="#FFFFFF" stroke="#DCE8F6"/>
<text x="40" y="43" font-size="22" fill="#0982E6" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">easy-vibe</text>
<text x="1160" y="43" font-size="15" fill="#6985A6" font-weight="600" text-anchor="end" data-fit-width="600" data-fit-base-size="15">01 / ELIGE TU INICIO</text>
<text x="40" y="103" font-size="38" fill="#132B49" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="38">¿Por dónde empezamos?</text>
<text x="40" y="144" font-size="22" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">Elige según lo que ya sabes y lo que quieres construir.</text>
<rect x="40" y="176" width="1120" height="46" rx="10" fill="#F2F7FD"/>
<text x="62" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="288" data-fit-base-size="20">Punto de partida</text>
<text x="370" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="20">Qué aprender y cómo</text>
<text x="905" y="206" font-size="20" fill="#527295" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un primer resultado</text>
<rect x="40" y="238" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="238" width="6" height="126" rx="3" fill="#1674DB"/>
<text x="64" y="278" font-size="22" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Sin experiencia en código</text>
<text x="64" y="311" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Estudiantes, docentes y profesionales</text>
<text x="370" y="265" font-size="12" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">PRIMER CONTACTO → ETAPA 1</text>
<rect x="370" y="278" width="148" height="32" rx="7" fill="#EDF5FF"/>
<text x="444" y="300" font-size="16" fill="#1674DB" font-weight="550" text-anchor="middle" data-fit-width="132" data-fit-base-size="16">Probar IA</text>
<path d="M524 294h13m-4-4 4 4-4 4" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="548" y="278" width="148" height="32" rx="7" fill="#EDF5FF"/>
<text x="622" y="300" font-size="16" fill="#1674DB" font-weight="550" text-anchor="middle" data-fit-width="132" data-fit-base-size="16">IDE con IA</text>
<text x="370" y="341" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Ejecuta un ejemplo y cambia una función.</text>
<path d="M875 263v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="288" font-size="17.2" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un pequeño juego funcional</text>
<text x="905" y="322" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">De la idea a algo que funciona.</text>
<rect x="40" y="380" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="380" width="6" height="126" rx="3" fill="#6755C9"/>
<text x="64" y="420" font-size="22" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Una idea por validar</text>
<text x="64" y="453" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Producto, diseño y emprendimiento</text>
<text x="370" y="407" font-size="12" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">ETAPA 1 · PROTOTIPOS</text>
<rect x="370" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="439" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Necesidad real</text>
<path d="M514 436h13m-4-4 4 4-4 4" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="607" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Prototipar</text>
<path d="M682 436h13m-4-4 4 4-4 4" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="420" width="138" height="32" rx="7" fill="#F1EEFF"/>
<text x="775" y="442" font-size="16" fill="#6755C9" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Integrar IA</text>
<text x="370" y="483" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Deja que usuarios lo prueben y mejóralo.</text>
<path d="M875 405v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="430" font-size="19.2" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un prototipo de producto</text>
<text x="905" y="464" font-size="14.5" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Valida la necesidad antes de seguir.</text>
<rect x="40" y="522" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="522" width="6" height="126" rx="3" fill="#088878"/>
<text x="64" y="562" font-size="19.7" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Sé programar, quiero publicar</text>
<text x="64" y="595" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Desarrollo frontend y backend</text>
<text x="370" y="549" font-size="12" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">ETAPA 2 · DESARROLLO FULL STACK</text>
<rect x="370" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="439" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Interfaz y API</text>
<path d="M514 578h13m-4-4 4 4-4 4" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="607" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Base de datos</text>
<path d="M682 578h13m-4-4 4 4-4 4" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="562" width="138" height="32" rx="7" fill="#EAF8F4"/>
<text x="775" y="584" font-size="16" fill="#088878" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Despliegue</text>
<text x="370" y="625" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Elige un proyecto y conecta todas las piezas.</text>
<path d="M875 547v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="572" font-size="20" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Una aplicación en línea</text>
<text x="905" y="606" font-size="15" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Del desarrollo a la publicación.</text>
<rect x="40" y="664" width="1120" height="126" rx="12" fill="#FFFFFF" stroke="#DFEAF7"/>
<rect x="40" y="664" width="6" height="126" rx="3" fill="#B66B1B"/>
<text x="64" y="704" font-size="22" fill="#173654" font-weight="650" text-anchor="start" data-fit-width="286" data-fit-base-size="22">Ya he publicado proyectos</text>
<text x="64" y="737" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="286" data-fit-base-size="17">Desarrollo y liderazgo técnico</text>
<text x="370" y="691" font-size="12" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="480" data-fit-base-size="12">ETAPA 3 · DESARROLLO AVANZADO</text>
<rect x="370" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="439" y="726" font-size="16" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Flujo con IA</text>
<path d="M514 720h13m-4-4 4 4-4 4" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="538" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="607" y="726" font-size="16" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Extensiones</text>
<path d="M682 720h13m-4-4 4 4-4 4" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="706" y="704" width="138" height="32" rx="7" fill="#FFF4E6"/>
<text x="775" y="726" font-size="16" fill="#B66B1B" font-weight="550" text-anchor="middle" data-fit-width="122" data-fit-base-size="16">Plataformas</text>
<text x="370" y="767" font-size="17" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="480" data-fit-base-size="17">Elige una ruta; divide tareas y verifica.</text>
<path d="M875 689v76" stroke="#E0EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="905" y="714" font-size="15.7" fill="#173654" font-weight="600" text-anchor="start" data-fit-width="235" data-fit-base-size="20">Un proyecto que evoluciona</text>
<text x="905" y="748" font-size="14.4" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="235" data-fit-base-size="15">Haz que colaborar con IA sea fiable.</text>
<text x="40" y="854" font-size="17" fill="#607B99" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="17">Empieza por la guía. Puedes saltar lo que ya dominas: elige por tus habilidades y objetivos, no solo por tu profesión.</text>
</g></svg>
