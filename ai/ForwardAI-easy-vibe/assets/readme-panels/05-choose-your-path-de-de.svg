<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc" lang="de-de">
<title id="title">Wo fangen wir an?</title><desc id="desc">Wähle nach deinem aktuellen Können und dem, was du entwickeln möchtest. Neu beim Programmieren / ERSTE SCHRITTE → STUFE 1 / Ein lauffähiges kleines Spiel; Eine Idee prüfen / STUFE 1 · PROTOTYPEN / Ein testbarer Prototyp; Programmieren, dann liefern / STUFE 2 · FULL-STACK-ENTWICKLUNG / Eine online nutzbare App; Bereits Projekte ausgeliefert / STUFE 3 · FORTGESCHRITTEN / Ein erweiterbares Projekt</desc>
