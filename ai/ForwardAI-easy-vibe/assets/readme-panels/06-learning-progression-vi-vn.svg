<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="vi-vn">
<title id="title">Từ trò chơi đầu tiên đến dự án phức tạp</title><desc id="desc">Mỗi bước có một sản phẩm chạy được để xác nhận tiến bộ. Học tiếp khi mục tiêu cần đến. TRẢI NGHIỆM ĐẦU / Tạo mã qua đối thoại / Trò chơi chạy được; GIAI ĐOẠN 1 · TẠO MẪU / Kiểm chứng ý tưởng / Nguyên mẫu trình diễn được; GIAI ĐOẠN 2 · FULL STACK / Tự triển khai ứng dụng / Ứng dụng trực tuyến; GIAI ĐOẠN 3 · NÂNG CAO / Làm dự án phức tạp / Dự án cải tiến liên tục</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="1198" height="948" rx="22" fill="#FFFFFF" stroke="#DCE8F6"/>
<text x="40" y="43" font-size="22" fill="#0982E6" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="22">easy-vibe</text>
<text x="1160" y="43" font-size="15" fill="#6985A6" font-weight="600" text-anchor="end" data-fit-width="600" data-fit-base-size="15">02 / XEM LỘ TRÌNH TIẾN BỘ</text>
<text x="40" y="102" font-size="38" fill="#132B49" font-weight="700" text-anchor="start" data-fit-width="1120" data-fit-base-size="38">Từ trò chơi đầu tiên đến dự án phức tạp</text>
<text x="40" y="143" font-size="21" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="1120" data-fit-base-size="21">Mỗi bước có một sản phẩm chạy được để xác nhận tiến bộ. Học tiếp khi mục tiêu cần đến.</text>
<path d="M40 778H315V718H605V658H895V598H1160" stroke="#B8CEE9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="365" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="40" y="365" width="250" height="7" rx="3" fill="#1674DB"/>
<rect x="58" y="387" width="42" height="37" rx="9" fill="#EDF5FF"/>
<text x="79" y="413" font-size="23" fill="#1674DB" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">00</text>
<text x="58" y="453" font-size="13" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">TRẢI NGHIỆM ĐẦU</text>
<text x="58" y="493" font-size="21" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Tạo mã qua đối thoại</text>
<text x="58" y="529" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Mô tả → chạy → quan sát → sửa</text>
<text x="58" y="559" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Chạy trước, rồi sửa một tính năng.</text>
<path d="M58 581h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="58" y="609" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">TIÊU CHÍ HOÀN THÀNH</text>
<text x="58" y="643" font-size="18" fill="#1674DB" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Trò chơi chạy được</text>
<path d="M60 675l4 4 7-9" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="79" y="680" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Giải thích đầu vào và đầu ra.</text>
<path d="M60 703l4 4 7-9" stroke="#1674DB" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="79" y="708" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Sau khi sửa vẫn hoạt động đúng.</text>
<path d="M301 462l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="330" y="305" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="330" y="305" width="250" height="7" rx="3" fill="#6755C9"/>
<rect x="348" y="327" width="42" height="37" rx="9" fill="#F1EEFF"/>
<text x="369" y="353" font-size="23" fill="#6755C9" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">01</text>
<text x="348" y="393" font-size="13" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">GIAI ĐOẠN 1 · TẠO MẪU</text>
<text x="348" y="433" font-size="21" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Kiểm chứng ý tưởng</text>
<text x="348" y="469" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Nhu cầu → nguyên mẫu → AI</text>
<text x="348" y="499" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Mời người dùng thật thử và góp ý.</text>
<path d="M348 521h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="348" y="549" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">TIÊU CHÍ HOÀN THÀNH</text>
<text x="348" y="583" font-size="15.3" fill="#6755C9" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Nguyên mẫu trình diễn được</text>
<path d="M350 615l4 4 7-9" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="369" y="620" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Giải quyết việc gì, cho ai?</text>
<path d="M350 643l4 4 7-9" stroke="#6755C9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="369" y="648" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Cải tiến một lần theo phản hồi.</text>
<path d="M591 402l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="620" y="245" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="620" y="245" width="250" height="7" rx="3" fill="#088878"/>
<rect x="638" y="267" width="42" height="37" rx="9" fill="#EAF8F4"/>
<text x="659" y="293" font-size="23" fill="#088878" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">02</text>
<text x="638" y="333" font-size="13" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">GIAI ĐOẠN 2 · FULL STACK</text>
<text x="638" y="373" font-size="19.1" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Tự triển khai ứng dụng</text>
<text x="638" y="409" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Giao diện → API → dữ liệu → triển khai</text>
<text x="638" y="439" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Kết nối các phần trong dự án đầy đủ.</text>
<path d="M638 461h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="638" y="489" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">TIÊU CHÍ HOÀN THÀNH</text>
<text x="638" y="523" font-size="18" fill="#088878" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Ứng dụng trực tuyến</text>
<path d="M640 555l4 4 7-9" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="659" y="560" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Lưu dữ liệu và chạy luồng chính.</text>
<path d="M640 583l4 4 7-9" stroke="#088878" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="659" y="588" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Người khác mở và sử dụng được.</text>
<path d="M881 342l18-26m-8 2 8-2 1 8" stroke="#7697BE" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="910" y="185" width="250" height="385" rx="15" fill="#FFFFFF" stroke="#D9E7F7"/>
<rect x="910" y="185" width="250" height="7" rx="3" fill="#B66B1B"/>
<rect x="928" y="207" width="42" height="37" rx="9" fill="#FFF4E6"/>
<text x="949" y="233" font-size="23" fill="#B66B1B" font-weight="650" text-anchor="middle" data-fit-width="36" data-fit-base-size="23">03</text>
<text x="928" y="273" font-size="13" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="13">GIAI ĐOẠN 3 · NÂNG CAO</text>
<text x="928" y="313" font-size="21" fill="#173654" font-weight="700" text-anchor="start" data-fit-width="214" data-fit-base-size="21">Làm dự án phức tạp</text>
<text x="928" y="349" font-size="11" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="11">Chia việc → công cụ → nền tảng</text>
<text x="928" y="379" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="214" data-fit-base-size="12">Chọn quy trình và công cụ theo dự án.</text>
<path d="M928 401h214" stroke="#E1EAF5" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="928" y="429" font-size="12" fill="#6C829C" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="12">TIÊU CHÍ HOÀN THÀNH</text>
<text x="928" y="463" font-size="18" fill="#B66B1B" font-weight="600" text-anchor="start" data-fit-width="214" data-fit-base-size="18">Dự án cải tiến liên tục</text>
<path d="M930 495l4 4 7-9" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="949" y="500" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Xác định phạm vi và tiêu chí xong.</text>
<path d="M930 523l4 4 7-9" stroke="#B66B1B" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="949" y="528" font-size="12" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="193" data-fit-base-size="12">Kiểm tra luồng chính sau khi sửa.</text>
<rect x="355" y="725" width="805" height="85" rx="12" fill="#F2F7FD"/>
<text x="378" y="759" font-size="22" fill="#24486D" font-weight="600" text-anchor="start" data-fit-width="760" data-fit-base-size="22">Giữ lại sản phẩm và nhật ký cải tiến</text>
<text x="378" y="792" font-size="16" fill="#425978" font-weight="400" text-anchor="start" data-fit-width="760" data-fit-base-size="16">Dùng lại dự án: tìm vấn đề, tìm nguyên nhân, sửa và kiểm chứng.</text>
<rect x="40" y="848" width="1120" height="62" rx="12" fill="#F6F9FD"/>
<text x="62" y="887" font-size="17" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="17">Không cần đọc hết trước khi làm</text>
<text x="428" y="887" font-size="17" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="17">Tra phụ lục khi thiếu kiến thức nền</text>
<text x="794" y="887" font-size="17" fill="#527295" font-weight="500" text-anchor="start" data-fit-width="342" data-fit-base-size="17">Chọn một hướng nâng cao theo dự án</text>
</g></svg>
