<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wishlabs - We shape the intelligence behind modern creativity. We build the tools that turn latest AI into everyday creative power."
    />
    <title>Wishlabs - We shape the intelligence behind modern creativity</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="background-layer" aria-hidden="true">
      <div class="clouds"></div>
      <div class="mountains-back"></div>
      <div class="mountains-mid"></div>
      <div class="mountains-front"></div>
    </div>

    <div class="container">
      <nav class="navbar" role="navigation" aria-label="Main navigation">
        <a href="/" class="logo" aria-label="Wishlabs home">W</a>
        <div class="nav-links">
          <a href="#products" class="nav-link">Products</a>
          <a href="#jobs" class="nav-link">Jobs</a>
        </div>
      </nav>

      <main class="hero" id="main-content">
        <div class="hero-content">
          <p class="hero-subtitle-top">Welcome to</p>
          <h1 class="hero-title">wishlabs</h1>
          <p class="hero-subtitle">
            We shape the intelligence<br />behind modern creativity.
          </p>
        </div>

        <section class="products-row" aria-label="Our products">
          <div
            class="product-item"
            role="button"
            tabindex="0"
            aria-label="Rotate - image rotation tool"
          >
            <div class="product-icon rotate-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 2v6h-6" />
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                <path d="M3 22v-6h6" />
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
              </svg>
            </div>
            <span class="product-name">rotate</span>
          </div>

          <div
            class="product-item"
            role="button"
            tabindex="0"
            aria-label="Magic - AI magic tool"
          >
            <div class="product-icon magic-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </div>
            <span class="product-name">magic</span>
          </div>

          <div
            class="product-item"
            role="button"
            tabindex="0"
            aria-label="Shots - video creation tool"
          >
            <div class="product-icon shots-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5,3 19,12 5,21" />
              </svg>
            </div>
            <span class="product-name">shots</span>
          </div>

          <div
            class="product-item"
            role="button"
            tabindex="0"
            aria-label="Home - home design tool"
          >
            <div class="product-icon home-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              </svg>
            </div>
            <span class="product-name">home</span>
          </div>

          <div
            class="product-item"
            role="button"
            tabindex="0"
            aria-label="Sparkles - special effects tool"
          >
            <div class="product-icon sparkles-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"
                />
                <path
                  d="M19 14l.75 2.25L22 17l-2.25.75L19 20l-.75-2.25L16 17l2.25-.75z"
                />
              </svg>
            </div>
            <span class="product-name">sparkles</span>
          </div>

          <div
            class="product-item"
            role="button"
            tabindex="0"
            aria-label="Layers - layer management tool"
          >
            <div class="product-icon layers-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="12 2 2 7 12 12 22 7 12 2" />
                <polyline points="2 17 12 22 22 17" />
                <polyline points="2 12 12 17 22 12" />
              </svg>
            </div>
            <span class="product-name">layers</span>
          </div>

          <div
            class="product-item"
            role="button"
            tabindex="0"
            aria-label="Palette - color palette tool"
          >
            <div class="product-icon palette-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="13.5" cy="6.5" r="0.5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r="0.5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r="0.5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r="0.5" fill="currentColor" />
                <path
                  d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.6 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.6-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5-4.5-9-10-9z"
                />
              </svg>
            </div>
            <span class="product-name">palette</span>
          </div>
        </section>

        <div class="bottom-content">
          <p class="bottom-text">
            We build the tools that turn latest AI<br />into everyday creative
            power.<br />Used by millions. Powered by research.
          </p>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
