<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
  <title id="title">工业现场中的上下位机关系</title>
  <desc id="desc">传感器和执行器连接下位机，下位机通过工业协议连接 Qt 上位机，操作员通过上位机查看状态和报警。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#102c3d"/>
    </linearGradient>
    <linearGradient id="upper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5a8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#67e8f9"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #67e8f9; }
      .heading { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .label { font-size: 24px; font-weight: 750; fill: #f8fafc; }
      .body { font-size: 19px; fill: #cbd5e1; }
      .small { font-size: 17px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1440" height="680" rx="30" fill="url(#bg)"/>
  <text x="70" y="66" class="eyebrow">本篇里的设备通信链路</text>
  <text x="70" y="112" class="heading">下位机负责安全控制，Qt 上位机负责看懂与操作</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="265" height="330" rx="24" fill="#102b3a" stroke="#28566d" stroke-width="2"/>
    <circle cx="202" cy="230" r="44" fill="#143d50"/>
    <path d="M178 246h48M188 230h28M197 214h10" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
    <text x="202" y="307" text-anchor="middle" class="label">现场设备</text>
    <text x="202" y="348" text-anchor="middle" class="body">温度 · 压力 · 振动</text>
    <text x="202" y="382" text-anchor="middle" class="body">电机 · 阀门 · 机械臂</text>
    <rect x="105" y="423" width="194" height="45" rx="22" fill="#0b2230"/>
    <text x="202" y="452" text-anchor="middle" class="small">采集与执行</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="415" y="170" width="300" height="330" rx="24" fill="#173149" stroke="#3b6d8d" stroke-width="2"/>
    <rect x="508" y="198" width="114" height="76" rx="14" fill="#214d6c"/>
    <circle cx="535" cy="236" r="9" fill="#22c55e"/>
    <circle cx="565" cy="236" r="9" fill="#fbbf24"/>
    <circle cx="595" cy="236" r="9" fill="#fb7185"/>
    <text x="565" y="307" text-anchor="middle" class="label">下位机</text>
    <text x="565" y="348" text-anchor="middle" class="body">PLC / MCU / 控制器</text>
    <text x="565" y="382" text-anchor="middle" class="body">实时采集 · 控制 · 联锁</text>
    <rect x="455" y="423" width="220" height="45" rx="22" fill="#0b2230"/>
    <text x="565" y="452" text-anchor="middle" class="small">设备安全留在这里</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="170" width="565" height="330" rx="24" fill="#0f3740" stroke="#21a09c" stroke-width="2"/>
    <rect x="853" y="205" width="469" height="74" rx="14" fill="#0b2430"/>
    <circle cx="888" cy="242" r="10" fill="#22c55e"/>
    <path d="M922 258v-31M947 258v-48M972 258v-22M997 258v-38M1022 258v-14" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>
    <rect x="1170" y="224" width="116" height="36" rx="18" fill="#123d42"/>
    <text x="1228" y="248" text-anchor="middle" class="small" fill="#86efac">设备已连接</text>
    <text x="1087" y="326" text-anchor="middle" class="label">Qt 上位机</text>
    <text x="1087" y="367" text-anchor="middle" class="body">状态 · 趋势 · 报警 · 记录</text>
    <text x="1087" y="401" text-anchor="middle" class="body">运行在工控机、控制台或触摸屏</text>
    <rect x="971" y="435" width="232" height="45" rx="22" fill="url(#upper)"/>
    <text x="1087" y="464" text-anchor="middle" class="small" fill="#052e31">本篇：PySide6 客户端</text>
  </g>

  <path d="M347 335H395" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M727 335H785" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="706" y="292" width="111" height="35" rx="17" fill="#0b2230" stroke="#28566d"/>
  <text x="761" y="316" text-anchor="middle" class="small">TCP / Modbus</text>

  <rect x="70" y="548" width="1300" height="77" rx="18" fill="#241f2b" stroke="#7f4961"/>
  <circle cx="116" cy="586" r="18" fill="#fb7185"/>
  <text x="116" y="593" text-anchor="middle" font-size="22" font-weight="800" fill="#241f2b">!</text>
  <text x="153" y="579" class="body" fill="#fecdd3">上位机可以退出、重启或断线，急停和安全联锁仍要由下位机继续执行。</text>
  <text x="153" y="608" class="small">本篇先用本地 TCP 模拟器代替真实 PLC，验证连接、断线、报警和数据保存。</text>
</svg>
