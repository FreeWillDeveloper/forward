<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Qt 上位机负责设备监控、操作、记录和分析</title>
  <desc id="desc">操作员通过工业电脑上的 Qt 上位机查看设备状态、趋势和报警，并向下位机发送经过授权的操作请求。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071826"/>
      <stop offset="1" stop-color="#153047"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#67e8f9"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #67e8f9; }
      .heading { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .label { font-size: 25px; font-weight: 750; fill: #f8fafc; }
      .body { font-size: 19px; fill: #cbd5e1; }
      .small { font-size: 17px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1440" height="720" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" class="eyebrow">SUPERVISORY COMPUTER · 上位机</text>
  <text x="70" y="116" class="heading">面向操作员：把设备数据变成看得懂、能追溯的工作界面</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="260" height="345" rx="24" fill="#102b3a" stroke="#28566d" stroke-width="2"/>
    <circle cx="200" cy="248" r="38" fill="#16435a"/>
    <circle cx="200" cy="236" r="14" fill="#67e8f9"/>
    <path d="M164 283c8-28 64-28 72 0" fill="#67e8f9"/>
    <text x="200" y="334" text-anchor="middle" class="label">操作员</text>
    <text x="200" y="376" text-anchor="middle" class="body">查看状态与报警</text>
    <text x="200" y="410" text-anchor="middle" class="body">修改允许的参数</text>
    <text x="200" y="444" text-anchor="middle" class="body">确认并记录处理</text>
    <rect x="105" y="474" width="190" height="34" rx="17" fill="#0b2230"/>
    <text x="200" y="497" text-anchor="middle" class="small">人机交互入口</text>
  </g>

  <path d="M347 352H403" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="420" y="160" width="660" height="390" rx="28" fill="#0b2230" stroke="#5eead4" stroke-width="2"/>
    <rect x="454" y="194" width="592" height="310" rx="18" fill="url(#screen)"/>
    <text x="486" y="234" class="label">Plant Operations Console</text>
    <rect x="876" y="208" width="136" height="36" rx="18" fill="#123d42"/>
    <circle cx="902" cy="226" r="8" fill="#22c55e"/>
    <text x="948" y="232" text-anchor="middle" class="small" fill="#86efac">设备已连接</text>

    <g transform="translate(486 268)">
      <rect width="150" height="82" rx="15" fill="#0b3440"/>
      <text x="18" y="30" class="small">当前温度</text>
      <text x="18" y="65" class="label">72.4℃</text>
    </g>
    <g transform="translate(651 268)">
      <rect width="150" height="82" rx="15" fill="#0b3440"/>
      <text x="18" y="30" class="small">当前压力</text>
      <text x="18" y="65" class="label">1.82 MPa</text>
    </g>
    <g transform="translate(816 268)">
      <rect width="196" height="82" rx="15" fill="#3d2733" stroke="#fb7185"/>
      <text x="18" y="30" class="small" fill="#fecdd3">活动报警</text>
      <text x="18" y="65" class="label" fill="#fda4af">高温预警</text>
    </g>

    <rect x="486" y="371" width="526" height="102" rx="15" fill="#0b3440"/>
    <text x="505" y="402" class="small">最近趋势</text>
    <path d="M509 450 557 438 605 445 653 420 701 431 749 405 797 414 845 383 893 412 941 397 989 408" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M509 459H989" stroke="#28566d" stroke-width="2"/>
    <rect x="620" y="516" width="260" height="56" rx="12" fill="#173149"/>
    <rect x="682" y="550" width="136" height="15" rx="7" fill="#28566d"/>
    <text x="750" y="544" text-anchor="middle" class="small">Qt / PySide6 上位机</text>
  </g>

  <path d="M1096 352H1132" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1150" y="180" width="220" height="345" rx="24" fill="#102b3a" stroke="#28566d" stroke-width="2"/>
    <text x="1260" y="222" text-anchor="middle" class="label">常见功能</text>
    <g transform="translate(1178 250)">
      <rect width="164" height="48" rx="14" fill="#0b2230"/>
      <text x="82" y="31" text-anchor="middle" class="body">状态与趋势</text>
    </g>
    <g transform="translate(1178 311)">
      <rect width="164" height="48" rx="14" fill="#0b2230"/>
      <text x="82" y="31" text-anchor="middle" class="body">报警与记录</text>
    </g>
    <g transform="translate(1178 372)">
      <rect width="164" height="48" rx="14" fill="#0b2230"/>
      <text x="82" y="31" text-anchor="middle" class="body">配方与参数</text>
    </g>
    <g transform="translate(1178 433)">
      <rect width="164" height="48" rx="14" fill="#0b2230"/>
      <text x="82" y="31" text-anchor="middle" class="body">历史与报表</text>
    </g>
  </g>

  <rect x="70" y="592" width="1300" height="72" rx="18" fill="#0b2935" stroke="#28566d"/>
  <path d="M105 628h36" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="165" y="622" class="body" fill="#a5f3fc">界面按钮发出操作请求</text>
  <text x="165" y="649" class="small">PLC 或控制器检查联锁条件以后，才真正驱动现场设备。</text>
  <rect x="1022" y="608" width="304" height="40" rx="20" fill="#123d42"/>
  <text x="1174" y="634" text-anchor="middle" class="small" fill="#86efac">上位机可以重启，安全控制不能中断</text>
</svg>
