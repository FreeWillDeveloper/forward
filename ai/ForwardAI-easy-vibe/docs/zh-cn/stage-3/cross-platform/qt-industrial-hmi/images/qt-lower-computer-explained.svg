<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">下位机负责现场采集、控制和安全联锁</title>
  <desc id="desc">传感器和开关信号进入 PLC 或控制器，控制器执行周期扫描、条件判断和安全联锁，再驱动电机、阀门和继电器。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071826"/>
      <stop offset="1" stop-color="#153047"/>
    </linearGradient>
    <linearGradient id="plc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#67e8f9"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #67e8f9; }
      .heading { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .label { font-size: 25px; font-weight: 750; fill: #f8fafc; }
      .body { font-size: 19px; fill: #cbd5e1; }
      .small { font-size: 17px; fill: #94a3b8; }
      .step { font-size: 18px; font-weight: 700; fill: #a5f3fc; }
    </style>
  </defs>

  <rect width="1440" height="720" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" class="eyebrow">LOWER-LEVEL CONTROLLER · 下位机</text>
  <text x="70" y="116" class="heading">离设备最近：读取现场信号，决定设备怎样动作</text>

  <g filter="url(#shadow)">
    <rect x="70" y="174" width="300" height="350" rx="24" fill="#102b3a" stroke="#28566d" stroke-width="2"/>
    <text x="220" y="222" text-anchor="middle" class="label">现场输入</text>
    <g transform="translate(105 253)">
      <rect width="230" height="62" rx="15" fill="#0b2230"/>
      <circle cx="32" cy="31" r="12" fill="#22c55e"/>
      <text x="58" y="38" class="body">温度、压力、振动</text>
    </g>
    <g transform="translate(105 330)">
      <rect width="230" height="62" rx="15" fill="#0b2230"/>
      <path d="M22 31h20M32 21v20" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
      <text x="58" y="38" class="body">限位开关、按钮</text>
    </g>
    <g transform="translate(105 407)">
      <rect width="230" height="62" rx="15" fill="#0b2230"/>
      <path d="M21 40 32 20l11 20Z" fill="none" stroke="#67e8f9" stroke-width="5"/>
      <text x="58" y="38" class="body">编码器、采集模块</text>
    </g>
  </g>

  <path d="M388 349H444" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="416" y="328" text-anchor="middle" class="small">读取</text>

  <g filter="url(#shadow)">
    <rect x="460" y="160" width="510" height="380" rx="26" fill="url(#plc)" stroke="#5eead4" stroke-width="2"/>
    <rect x="505" y="201" width="420" height="85" rx="16" fill="#0b2935"/>
    <circle cx="543" cy="243" r="11" fill="#22c55e"/>
    <circle cx="580" cy="243" r="11" fill="#fbbf24"/>
    <circle cx="617" cy="243" r="11" fill="#fb7185"/>
    <rect x="675" y="221" width="203" height="44" rx="8" fill="#153f4b"/>
    <text x="776" y="250" text-anchor="middle" class="body">PLC / MCU / 控制器</text>
    <text x="715" y="330" text-anchor="middle" class="label">固定周期反复执行</text>
    <g transform="translate(505 360)">
      <rect width="122" height="74" rx="16" fill="#0b3440"/>
      <text x="61" y="31" text-anchor="middle" class="step">1 读取输入</text>
      <text x="61" y="56" text-anchor="middle" class="small">采集状态</text>
    </g>
    <path d="M638 397H663" stroke="#a5f3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(675 360)">
      <rect width="122" height="74" rx="16" fill="#0b3440"/>
      <text x="61" y="31" text-anchor="middle" class="step">2 判断条件</text>
      <text x="61" y="56" text-anchor="middle" class="small">顺序与联锁</text>
    </g>
    <path d="M808 397H833" stroke="#a5f3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(845 360)">
      <rect width="80" height="74" rx="16" fill="#0b3440"/>
      <text x="40" y="31" text-anchor="middle" class="step">3 输出</text>
      <text x="40" y="56" text-anchor="middle" class="small">执行动作</text>
    </g>
    <rect x="548" y="464" width="334" height="45" rx="22" fill="#072a2f"/>
    <text x="715" y="493" text-anchor="middle" class="body" fill="#86efac">安全联锁与故障保护留在这里</text>
  </g>

  <path d="M987 349H1043" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1015" y="328" text-anchor="middle" class="small">驱动</text>

  <g filter="url(#shadow)">
    <rect x="1060" y="174" width="310" height="350" rx="24" fill="#102b3a" stroke="#28566d" stroke-width="2"/>
    <text x="1215" y="222" text-anchor="middle" class="label">现场输出</text>
    <g transform="translate(1098 253)">
      <rect width="234" height="62" rx="15" fill="#0b2230"/>
      <circle cx="32" cy="31" r="16" fill="none" stroke="#67e8f9" stroke-width="5"/>
      <path d="M32 15v32M16 31h32" stroke="#67e8f9" stroke-width="4"/>
      <text x="62" y="38" class="body">电机、伺服驱动</text>
    </g>
    <g transform="translate(1098 330)">
      <rect width="234" height="62" rx="15" fill="#0b2230"/>
      <path d="M20 20h24v22H20zM32 20V10M32 52V42" fill="none" stroke="#22c55e" stroke-width="5"/>
      <text x="62" y="38" class="body">阀门、气缸</text>
    </g>
    <g transform="translate(1098 407)">
      <rect width="234" height="62" rx="15" fill="#0b2230"/>
      <path d="M18 38h18l10-14" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
      <text x="62" y="38" class="body">继电器、指示灯</text>
    </g>
  </g>

  <rect x="70" y="580" width="1300" height="84" rx="18" fill="#241f2b" stroke="#7f4961"/>
  <circle cx="116" cy="622" r="19" fill="#fb7185"/>
  <text x="116" y="629" text-anchor="middle" font-size="23" font-weight="800" fill="#241f2b">!</text>
  <text x="154" y="615" class="body" fill="#fecdd3">就算上位机退出或网络中断，下位机仍要继续完成安全控制。</text>
  <text x="154" y="645" class="small">急停、限位、过载保护和关键联锁不能依赖桌面界面。</text>
</svg>
