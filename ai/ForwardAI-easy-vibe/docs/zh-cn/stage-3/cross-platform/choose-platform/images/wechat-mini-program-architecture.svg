<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">微信小程序架构</title>
  <desc id="desc">用户在微信中打开小程序，小程序通过云函数或企业 API 访问数据库和文件存储。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker></defs>
  <rect width="1200" height="500" rx="28" fill="#f5fff8"/>
  <text x="60" y="65" font-size="30" font-weight="700" fill="#14532d" font-family="Inter, PingFang SC, sans-serif">微信小程序：把轻量服务放进用户已有的入口</text>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="55" y="150" width="210" height="170" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="3"/><text x="160" y="215" font-size="28" font-weight="700" fill="#166534">微信用户</text><text x="160" y="258" font-size="20" fill="#475569">扫码 · 分享 · 搜索</text>
    <rect x="350" y="125" width="240" height="220" rx="24" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="470" y="205" font-size="30" font-weight="700" fill="#166534">小程序</text><text x="470" y="252" font-size="21" fill="#475569">页面 · 表单 · 支付</text><text x="470" y="292" font-size="19" fill="#64748b">运行在微信客户端</text>
    <rect x="690" y="150" width="215" height="170" rx="22" fill="#ffffff" stroke="#67e8f9" stroke-width="3"/><text x="798" y="210" font-size="27" font-weight="700" fill="#155e75">云函数 / API</text><text x="798" y="258" font-size="20" fill="#475569">身份 · 业务规则</text>
    <rect x="995" y="150" width="155" height="170" rx="22" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/><text x="1072" y="215" font-size="26" font-weight="700" fill="#155e75">云端数据</text><text x="1072" y="258" font-size="19" fill="#475569">数据库 · 文件</text>
  </g>
  <g stroke="#16a34a" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M265 235 H340"/><path d="M590 235 H680"/><path d="M905 235 H985"/></g>
  <text x="60" y="430" font-size="22" fill="#475569" font-family="Inter, PingFang SC, sans-serif">常见软件：会员中心、预约、门店点单、活动报名、售后工单、物流查询</text>
</svg>
