<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Qt 与原生桌面架构</title>
  <desc id="desc">Qt 或原生桌面界面连接 C++ 业务层，再访问设备协议、本地数据和企业服务。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="500" rx="28" fill="#f7faff"/>
  <text x="60" y="65" font-size="30" font-weight="700" fill="#172554" font-family="Inter, PingFang SC, sans-serif">Qt / 原生桌面：本地业务直接连接设备和系统</text>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="220" height="190" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="165" y="210" font-size="28" font-weight="700" fill="#1e3a8a">桌面界面</text><text x="165" y="255" font-size="20" fill="#475569">Qt Quick · Widgets</text><text x="165" y="292" font-size="18" fill="#64748b">长期运行与操作</text>
    <rect x="370" y="145" width="220" height="190" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/><text x="480" y="210" font-size="28" font-weight="700" fill="#1e3a8a">业务层</text><text x="480" y="255" font-size="20" fill="#475569">C++ · QML · Python</text><text x="480" y="292" font-size="18" fill="#64748b">规则与实时处理</text>
    <rect x="685" y="115" width="220" height="120" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="795" y="165" font-size="25" font-weight="700" fill="#9a3412">设备与协议</text><text x="795" y="202" font-size="18" fill="#475569">串口 · Modbus · CAN</text>
    <rect x="685" y="270" width="220" height="120" rx="22" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/><text x="795" y="320" font-size="25" font-weight="700" fill="#166534">本地数据</text><text x="795" y="357" font-size="18" fill="#475569">文件 · 数据库 · 缓存</text>
    <rect x="1005" y="145" width="150" height="190" rx="24" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/><text x="1080" y="205" font-size="24" font-weight="700" fill="#155e75">企业服务</text><text x="1080" y="248" font-size="18" fill="#475569">API</text><text x="1080" y="280" font-size="18" fill="#475569">报表</text><text x="1080" y="312" font-size="18" fill="#475569">审计</text>
  </g>
  <g stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M275 240 H360"/><path d="M590 220 C630 220 635 175 675 175"/><path d="M590 260 C630 260 635 330 675 330"/><path d="M905 240 H995"/></g>
  <text x="60" y="445" font-size="22" fill="#475569" font-family="Inter, PingFang SC, sans-serif">常见软件：设备控制台、医疗影像、汽车诊断、实验室软件、工程设计与交易终端</text>
