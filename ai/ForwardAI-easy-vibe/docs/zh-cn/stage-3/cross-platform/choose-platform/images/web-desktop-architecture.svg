<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Electron 与 Tauri 桌面架构</title>
  <desc id="desc">Web 界面通过受控桥接调用桌面进程，再访问文件、通知和其他系统能力。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
  <rect width="1200" height="500" rx="28" fill="#f3fffd"/>
  <text x="60" y="65" font-size="30" font-weight="700" fill="#134e4a" font-family="Inter, PingFang SC, sans-serif">Electron / Tauri：Web 界面装进真正的桌面窗口</text>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="230" height="190" rx="24" fill="#ccfbf1" stroke="#5eead4" stroke-width="3"/><text x="170" y="210" font-size="28" font-weight="700" fill="#115e59">Web 界面</text><text x="170" y="255" font-size="20" fill="#475569">Vue · React · HTML</text><text x="170" y="292" font-size="18" fill="#64748b">渲染用户界面</text>
    <rect x="385" y="145" width="220" height="190" rx="24" fill="#ffffff" stroke="#2dd4bf" stroke-width="3"/><text x="495" y="205" font-size="27" font-weight="700" fill="#115e59">安全桥接</text><text x="495" y="250" font-size="20" fill="#475569">IPC / Commands</text><text x="495" y="288" font-size="18" fill="#64748b">只开放必要能力</text>
    <rect x="705" y="145" width="220" height="190" rx="24" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/><text x="815" y="205" font-size="27" font-weight="700" fill="#1e3a8a">桌面进程</text><text x="815" y="250" font-size="20" fill="#475569">Node.js / Rust</text><text x="815" y="288" font-size="18" fill="#64748b">应用生命周期</text>
    <rect x="1025" y="145" width="130" height="190" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/><text x="1090" y="205" font-size="24" font-weight="700" fill="#1e3a8a">系统</text><text x="1090" y="248" font-size="18" fill="#475569">文件</text><text x="1090" y="280" font-size="18" fill="#475569">通知</text><text x="1090" y="312" font-size="18" fill="#475569">托盘</text>
  </g>
  <g stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M285 240 H375"/><path d="M605 240 H695"/><path d="M925 240 H1015"/></g>
  <text x="60" y="430" font-size="22" fill="#475569" font-family="Inter, PingFang SC, sans-serif">常见软件：协作客户端、AI 桌面助手、知识库、数据导入、客服与运营工作台</text>
</svg>
