<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Flutter 与 React Native 跨端移动架构</title>
  <desc id="desc">共享代码通过跨端框架生成 iOS 与 Android 应用，平台差异由插件和原生模块补齐。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs>
  <rect width="1200" height="500" rx="28" fill="#fbf7ff"/>
  <text x="60" y="65" font-size="30" font-weight="700" fill="#4c1d95" font-family="Inter, PingFang SC, sans-serif">跨端移动：共享大部分业务，把平台差异留在边缘</text>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="245" height="190" rx="24" fill="#f3e8ff" stroke="#c084fc" stroke-width="3"/><text x="177" y="205" font-size="28" font-weight="700" fill="#6b21a8">共享代码</text><text x="177" y="250" font-size="20" fill="#475569">界面 · 状态 · 业务</text><text x="177" y="288" font-size="19" fill="#64748b">Flutter / React Native</text>
    <rect x="420" y="120" width="245" height="120" rx="22" fill="#ffffff" stroke="#a5b4fc" stroke-width="3"/><text x="542" y="170" font-size="27" font-weight="700" fill="#3730a3">iOS 应用</text><text x="542" y="207" font-size="19" fill="#475569">平台适配与发布</text>
    <rect x="420" y="275" width="245" height="120" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="3"/><text x="542" y="325" font-size="27" font-weight="700" fill="#166534">Android 应用</text><text x="542" y="362" font-size="19" fill="#475569">平台适配与发布</text>
    <rect x="770" y="145" width="210" height="190" rx="22" fill="#ffffff" stroke="#fbbf24" stroke-width="3"/><text x="875" y="205" font-size="26" font-weight="700" fill="#92400e">原生插件</text><text x="875" y="250" font-size="20" fill="#475569">支付 · 地图 · 通知</text><text x="875" y="288" font-size="19" fill="#64748b">补齐平台差异</text>
    <rect x="1055" y="165" width="110" height="150" rx="22" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/><text x="1110" y="225" font-size="24" font-weight="700" fill="#155e75">API</text><text x="1110" y="264" font-size="18" fill="#475569">云端</text>
  </g>
  <g stroke="#7c3aed" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M300 220 C350 220 360 180 410 180"/><path d="M300 260 C350 260 360 335 410 335"/><path d="M665 180 H760"/><path d="M665 335 H760"/><path d="M980 240 H1045"/></g>
  <text x="60" y="450" font-size="22" fill="#475569" font-family="Inter, PingFang SC, sans-serif">常见软件：电商、会员、销售拜访、现场服务、内部办公、内容社区</text>
</svg>
