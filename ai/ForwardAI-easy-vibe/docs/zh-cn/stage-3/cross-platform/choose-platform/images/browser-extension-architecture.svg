<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">浏览器插件架构</title>
  <desc id="desc">内容脚本读取当前网页，后台服务协调任务，侧边栏展示结果并调用企业 API。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9333ea"/></marker></defs>
  <rect width="1200" height="500" rx="28" fill="#fcf7ff"/>
  <text x="60" y="65" font-size="30" font-weight="700" fill="#581c87" font-family="Inter, PingFang SC, sans-serif">浏览器插件：在当前网页旁边完成下一步</text>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="210" height="190" rx="24" fill="#ffffff" stroke="#d8b4fe" stroke-width="3"/><text x="160" y="210" font-size="28" font-weight="700" fill="#6b21a8">当前网页</text><text x="160" y="255" font-size="20" fill="#475569">客户 · 文档 · 表单</text><text x="160" y="292" font-size="18" fill="#64748b">用户正在处理的内容</text>
    <rect x="350" y="145" width="210" height="190" rx="24" fill="#f3e8ff" stroke="#c084fc" stroke-width="3"/><text x="455" y="210" font-size="27" font-weight="700" fill="#6b21a8">内容脚本</text><text x="455" y="255" font-size="20" fill="#475569">读取与有限修改</text><text x="455" y="292" font-size="18" fill="#64748b">按站点授权</text>
    <rect x="645" y="145" width="210" height="190" rx="24" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/><text x="750" y="205" font-size="26" font-weight="700" fill="#5b21b6">后台服务</text><text x="750" y="250" font-size="20" fill="#475569">消息 · 权限 · 任务</text><text x="750" y="288" font-size="18" fill="#64748b">Service Worker</text>
    <rect x="940" y="115" width="205" height="120" rx="22" fill="#fdf4ff" stroke="#e879f9" stroke-width="3"/><text x="1042" y="165" font-size="25" font-weight="700" fill="#86198f">侧边栏</text><text x="1042" y="202" font-size="18" fill="#475569">展示结果与操作</text>
    <rect x="940" y="270" width="205" height="120" rx="22" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/><text x="1042" y="320" font-size="25" font-weight="700" fill="#155e75">企业 API</text><text x="1042" y="357" font-size="18" fill="#475569">身份 · 数据 · AI</text>
  </g>
  <g stroke="#9333ea" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M265 240 H340"/><path d="M560 240 H635"/><path d="M855 210 C890 210 895 175 930 175"/><path d="M855 270 C890 270 895 330 930 330"/></g>
  <text x="60" y="445" font-size="22" fill="#475569" font-family="Inter, PingFang SC, sans-serif">常见软件：翻译、密码填充、销售线索、客服知识助手、合规检查、网页流程自动化</text>
</svg>
