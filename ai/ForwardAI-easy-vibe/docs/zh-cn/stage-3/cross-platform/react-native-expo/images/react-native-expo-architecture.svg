<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">React Native 与 Expo 的项目结构</title>
  <desc id="desc">一套 TypeScript 页面与业务逻辑经过 React Native 和 Expo 运行在 Android、iOS 与 Web，平台专属能力仍由各平台提供。</desc>
  <defs>
    <style>
      .bg { fill: #f5f7f3; }
      .card { fill: #ffffff; stroke: #d8ded7; stroke-width: 2; }
      .main { fill: #244f31; }
      .soft { fill: #e6f0e5; stroke: #a8c3aa; stroke-width: 2; }
      .platform { fill: #eef3ff; stroke: #b7c6e8; stroke-width: 2; }
      .title { fill: #17241a; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #17241a; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #556159; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .white { fill: #ffffff; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { fill: none; stroke: #66806c; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#66806c"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="660" rx="28"/>
  <text class="title" x="600" y="54" text-anchor="middle">同一套项目，三个运行目标</text>

  <rect class="card" x="70" y="100" width="350" height="180" rx="22"/>
  <text class="label" x="245" y="145" text-anchor="middle">TypeScript 项目</text>
  <text class="body" x="245" y="184" text-anchor="middle">页面、表单、状态、业务规则</text>
  <text class="body" x="245" y="218" text-anchor="middle">能共用的代码放在这里</text>
  <text class="body" x="245" y="252" text-anchor="middle">不是 HTML，也不是 WebView</text>

  <rect class="main" x="485" y="100" width="230" height="180" rx="22"/>
  <text class="white" x="600" y="158" text-anchor="middle">React Native</text>
  <text class="body" x="600" y="202" text-anchor="middle" style="fill:#dfeadf">把 React 界面交给</text>
  <text class="body" x="600" y="234" text-anchor="middle" style="fill:#dfeadf">各平台真正渲染</text>

  <rect class="soft" x="780" y="100" width="350" height="180" rx="22"/>
  <text class="label" x="955" y="145" text-anchor="middle">Expo</text>
  <text class="body" x="955" y="184" text-anchor="middle">项目脚手架、Router、设备 API</text>
  <text class="body" x="955" y="218" text-anchor="middle">开发构建、云端构建与更新</text>
  <text class="body" x="955" y="252" text-anchor="middle">需要时仍能接 Swift / Kotlin</text>

  <path class="arrow" d="M420 190 H478"/>
  <path class="arrow" d="M715 190 H773"/>

  <rect class="platform" x="70" y="390" width="300" height="170" rx="22"/>
  <text class="label" x="220" y="438" text-anchor="middle">Android</text>
  <text class="body" x="220" y="478" text-anchor="middle">原生控件与 Android API</text>
  <text class="body" x="220" y="512" text-anchor="middle">最终生成 APK / AAB</text>

  <rect class="platform" x="450" y="390" width="300" height="170" rx="22"/>
  <text class="label" x="600" y="438" text-anchor="middle">iOS</text>
  <text class="body" x="600" y="478" text-anchor="middle">原生控件与 Apple API</text>
  <text class="body" x="600" y="512" text-anchor="middle">最终生成 iOS App</text>

  <rect class="platform" x="830" y="390" width="300" height="170" rx="22"/>
  <text class="label" x="980" y="438" text-anchor="middle">Web</text>
  <text class="body" x="980" y="478" text-anchor="middle">React Native for Web</text>
  <text class="body" x="980" y="512" text-anchor="middle">最终生成静态 Web 资源</text>

  <path class="arrow" d="M600 280 V330 H220 V382"/>
  <path class="arrow" d="M600 280 V382"/>
  <path class="arrow" d="M600 330 H980 V382"/>
  <text class="body" x="600" y="622" text-anchor="middle">共用代码不等于三端完全一样；相机、通知、权限、返回手势和发布仍要分别验证。</text>
</svg>
